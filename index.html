<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考研英语 · 单词计划</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#18181b;--paper:#fafaf9;--surface:#f5f4f0;--card:#ffffff;
  --gold:#b5830a;--gold-bg:#fef9ee;--gold-bd:#f0d070;
  --green:#166534;--green-bg:#f0fdf4;--green-bd:#86efac;
  --red:#991b1b;--red-bg:#fff1f2;--red-bd:#fca5a5;
  --blue:#1e40af;--blue-bg:#eff6ff;--blue-bd:#93c5fd;
  --muted:#71717a;--border:#e4e4e7;--border2:#d4d4d8;
  --serif:'Noto Serif SC',serif;--mono:'JetBrains Mono',monospace;--sans:'Noto Sans SC',sans-serif;
}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;font-size:14px}
h1,h2,h3{font-family:var(--serif)}

/* ─ Loading ─ */
#loading{position:fixed;inset:0;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;z-index:999}
.spinner{width:30px;height:30px;border:2px solid var(--border2);border-top-color:var(--ink);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{font-size:.8rem;color:var(--muted)}

/* ─ Firebase config notice ─ */
#config-screen{display:none;min-height:100vh;align-items:center;justify-content:center;padding:2rem}
.config-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:2.5rem 2rem;max-width:560px;width:100%}
.config-box h2{font-size:1.25rem;margin-bottom:.5rem}
.config-box p{font-size:.82rem;color:var(--muted);margin-bottom:1.25rem;line-height:1.7}
.config-box pre{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:1rem;font-size:.72rem;font-family:var(--mono);overflow-x:auto;margin-bottom:1.25rem;line-height:1.8}
.config-box label{display:block;font-size:.78rem;font-weight:500;margin-bottom:4px;margin-top:.75rem}
.config-box input{width:100%;padding:.6rem .85rem;border:1px solid var(--border2);border-radius:6px;font-family:var(--mono);font-size:.78rem;background:var(--paper);color:var(--ink);outline:none;margin-bottom:0}
.config-box input:focus{border-color:var(--ink)}
.btn-save{margin-top:1.25rem;width:100%;padding:.7rem;background:var(--ink);color:#fff;border:none;border-radius:6px;font-size:.88rem;cursor:pointer;font-family:var(--sans)}
.step{display:flex;gap:.75rem;margin-bottom:.85rem;font-size:.8rem;line-height:1.6}
.step-num{background:var(--ink);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:600;flex-shrink:0;margin-top:2px}

/* ─ Auth ─ */
#auth-screen{display:none;min-height:100vh;align-items:center;justify-content:center;padding:2rem;background:var(--surface)}
.auth-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:2.5rem 2rem;width:100%;max-width:400px}
.auth-logo{text-align:center;margin-bottom:2rem}
.auth-logo h1{font-size:1.5rem;font-weight:700;letter-spacing:.04em}
.auth-logo p{font-size:.65rem;color:var(--muted);margin-top:4px;font-family:var(--mono);letter-spacing:.12em}
.form-row{margin-bottom:1rem}
.form-row label{display:block;font-size:.78rem;font-weight:500;margin-bottom:5px}
.form-row input{width:100%;padding:.6rem .85rem;border:1px solid var(--border2);border-radius:6px;font-family:var(--sans);font-size:.85rem;background:var(--paper);color:var(--ink);outline:none;transition:border-color .15s}
.form-row input:focus{border-color:var(--ink)}
.btn-main{width:100%;padding:.7rem;background:var(--ink);color:#fff;border:none;border-radius:6px;font-family:var(--sans);font-size:.88rem;font-weight:500;cursor:pointer;transition:opacity .15s}
.btn-main:hover{opacity:.85}
.btn-main:disabled{opacity:.5;cursor:not-allowed}
.auth-switch{text-align:center;margin-top:1.25rem;font-size:.78rem;color:var(--muted)}
.auth-switch span{color:var(--ink);cursor:pointer;font-weight:500;text-decoration:underline}
.msg-err{background:var(--red-bg);border:1px solid var(--red-bd);color:var(--red);padding:.6rem .85rem;border-radius:6px;font-size:.78rem;margin-bottom:1rem}
.msg-ok{background:var(--green-bg);border:1px solid var(--green-bd);color:var(--green);padding:.6rem .85rem;border-radius:6px;font-size:.78rem;margin-bottom:1rem}
.divider{display:flex;align-items:center;gap:.75rem;margin:1rem 0;color:var(--muted);font-size:.72rem}
.divider::before,.divider::after{content:'';flex:1;border-top:1px solid var(--border)}
.btn-google{width:100%;padding:.65rem;background:#fff;border:1px solid var(--border2);border-radius:6px;font-family:var(--sans);font-size:.82rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.6rem;transition:background .12s}
.btn-google:hover{background:var(--surface)}
.google-icon{width:18px;height:18px}

/* ─ App ─ */
#app-screen{display:none}
.app{max-width:880px;margin:0 auto;padding:0 1rem 4rem}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 0 1rem;border-bottom:2px solid var(--ink);margin-bottom:1.5rem;flex-wrap:wrap;gap:.75rem}
.topbar-left h1{font-size:1.3rem;font-weight:700;letter-spacing:.03em}
.topbar-left p{font-size:.62rem;color:var(--muted);font-family:var(--mono);letter-spacing:.1em;margin-top:2px}
.topbar-right{display:flex;align-items:center;gap:.6rem}
.user-chip{display:flex;align-items:center;gap:6px;font-size:.78rem;background:var(--surface);padding:.3rem .7rem;border-radius:999px;border:1px solid var(--border)}
.avatar{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:600;color:#fff;flex-shrink:0}
.btn-sm{padding:.3rem .75rem;border:1px solid var(--border2);border-radius:6px;background:var(--card);font-family:var(--sans);font-size:.72rem;cursor:pointer;color:var(--ink)}
.btn-sm:hover{background:var(--surface)}

/* ─ Banner ─ */
.banner{background:var(--ink);color:#fff;border-radius:8px;padding:1.25rem 1.5rem;margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.banner h2{font-family:var(--serif);font-size:1.05rem;font-weight:600}
.banner p{font-size:.72rem;color:#a1a1aa;margin-top:2px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:4px 12px;border-radius:999px;font-size:.7rem;font-weight:500;font-family:var(--mono);white-space:nowrap}
.p-new{background:#ca8a04;color:#fff}
.p-rev{background:#1d4ed8;color:#fff}
.p-done{background:#15803d;color:#fff}
.p-warn{background:#b45309;color:#fff}

/* ─ Alert ─ */
.alert-bar{background:var(--gold-bg);border:1px solid var(--gold-bd);border-left:3px solid var(--gold);border-radius:6px;padding:.7rem 1rem;margin-bottom:1.25rem;font-size:.78rem;display:none;align-items:center;gap:.75rem;flex-wrap:wrap}
.alert-bar.show{display:flex}

/* ─ Tabs ─ */
.tabs{display:flex;border-bottom:1.5px solid var(--border);margin-bottom:1.5rem;overflow-x:auto}
.tab{padding:.55rem 1rem;font-size:.76rem;font-weight:500;cursor:pointer;border:none;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;background:none;font-family:var(--sans);color:var(--muted);white-space:nowrap;transition:all .12s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.panel{display:none}.panel.on{display:block}

/* ─ Progress ─ */
.prog-wrap{margin-bottom:1.25rem}
.prog-label{display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted);margin-bottom:4px}
.prog-track{background:var(--surface);border-radius:2px;height:6px;overflow:hidden}
.prog-fill{height:100%;background:var(--ink);border-radius:2px;transition:width .4s ease}
.prog-fill.g{background:#16a34a}

/* ─ Flashcard ─ */
.fc-area{display:flex;flex-direction:column;align-items:center}
.fc-meta{width:100%;max-width:500px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:.63rem;color:var(--muted);margin-bottom:8px}
.fc{width:100%;max-width:500px;height:210px;perspective:1100px;cursor:pointer;margin-bottom:1rem}
.fc-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.fc-inner.flip{transform:rotateY(180deg)}
.fc-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:8px;border:1px solid var(--border2);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.75rem;box-shadow:2px 2px 0 var(--border)}
.fc-back{transform:rotateY(180deg)}
.fc-tag{position:absolute;top:12px;right:14px;font-size:.6rem;font-family:var(--mono);color:var(--muted)}
.fc-lbl{font-size:.62rem;color:var(--muted);letter-spacing:.1em;margin-bottom:5px}
.fc-word{font-family:var(--mono);font-size:1.9rem;font-weight:600;color:var(--ink)}
.fc-phon{font-size:.78rem;color:var(--muted);margin-top:6px}
.fc-hint{font-size:.66rem;color:var(--muted);margin-top:12px}
.fc-mean{font-family:var(--serif);font-size:1.2rem;font-weight:600;text-align:center;line-height:1.6;color:var(--ink)}
.fc-en2{font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-top:6px}
.rate-row{display:flex;gap:7px;width:100%;max-width:500px;margin-bottom:1rem}
.btn-r{flex:1;padding:.6rem .4rem;border-radius:6px;border:1px solid;font-size:.7rem;font-weight:500;cursor:pointer;font-family:var(--sans);line-height:1.4;transition:transform .1s,box-shadow .1s}
.btn-r:active{transform:scale(.97)}
.b-hard{border-color:#fca5a5;color:#991b1b;background:#fff1f2}
.b-ok{border-color:#fcd34d;color:#92400e;background:#fffbeb}
.b-good{border-color:#86efac;color:#166534;background:#f0fdf4}
.b-easy{border-color:#93c5fd;color:#1e40af;background:#eff6ff}
.b-sub{font-size:.58rem;display:block;opacity:.7;margin-top:1px}
.empty-card{text-align:center;padding:2.5rem 1rem;border:1px dashed var(--border2);border-radius:8px;width:100%;max-width:500px}
.empty-card .ic{font-size:2rem;margin-bottom:.75rem}
.empty-card h3{font-family:var(--serif);font-size:1rem;margin-bottom:.4rem}
.empty-card p{font-size:.75rem;color:var(--muted);margin-bottom:1rem}
.btn-checkin{padding:.6rem 1.5rem;background:var(--ink);color:#fff;border:none;border-radius:6px;font-family:var(--sans);font-size:.82rem;cursor:pointer}
.btn-checkin:disabled{opacity:.5;cursor:not-allowed}

/* ─ Calendar ─ */
.cal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:.85rem}
.cal-hdr h3{font-family:var(--serif);font-size:1rem}
.cal-nav button{background:none;border:1px solid var(--border);border-radius:4px;padding:3px 10px;cursor:pointer;font-size:.75rem;font-family:var(--sans)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:1.25rem}
.cal-lbl{text-align:center;font-size:.58rem;color:var(--muted);padding:3px 0;font-family:var(--mono)}
.cal-d{aspect-ratio:1;border-radius:5px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.65rem;position:relative}
.cal-d.today{border-color:var(--ink)!important;font-weight:700}
.cal-d.full{background:#15803d;color:#fff;border-color:#15803d}
.cal-d.partial{background:#ca8a04;color:#fff;border-color:#ca8a04}
.cal-d.chk{background:var(--ink);color:#fff;border-color:var(--ink)}
.cal-d.future{opacity:.3}
.cal-d.no-task{opacity:.35}
.cal-d.other-month{opacity:.18}
.cal-dnum{font-family:var(--mono);font-size:.68rem}
.cal-dot{width:4px;height:4px;border-radius:50%;background:currentColor;margin-top:1px;opacity:.5}

/* ─ Stats ─ */
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.25rem}
.sc{background:var(--surface);border-radius:6px;padding:.75rem .85rem}
.sc.hi{background:var(--ink);color:#fff}
.sc .lbl{font-size:.6rem;color:var(--muted);letter-spacing:.06em}
.sc.hi .lbl{color:#a1a1aa}
.sc .val{font-family:var(--mono);font-size:1.45rem;font-weight:600;margin-top:2px}

/* ─ Leaderboard ─ */
.lb-row{display:flex;align-items:center;gap:10px;padding:.6rem .75rem;border-radius:6px;border:1px solid var(--border);margin-bottom:6px;background:var(--card)}
.lb-row.me{border-color:var(--ink);background:var(--surface)}
.lb-rank{font-family:var(--mono);font-size:.8rem;font-weight:600;min-width:22px;color:var(--muted);text-align:center}
.lb-info{flex:1;min-width:0}
.lb-name{font-weight:500;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-sub{font-size:.65rem;color:var(--muted);margin-top:1px}
.lb-stats{text-align:right;font-family:var(--mono);font-size:.72rem;flex-shrink:0}

/* ─ Schedule ─ */
.sch-t{width:100%;border-collapse:collapse;font-size:.74rem}
.sch-t th{text-align:left;padding:5px 8px;border-bottom:2px solid var(--ink);font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;color:var(--muted);font-weight:600}
.sch-t td{padding:5px 8px;border-bottom:1px solid var(--border)}
.sch-t tr:hover td{background:var(--surface)}
.sch-t tr.trow td{background:#fffbeb;font-weight:500}
.badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:.6rem;font-family:var(--mono)}
.bn{background:#fef9c3;color:#713f12}.br{background:#dbeafe;color:#1e3a8a}.bd{background:#dcfce7;color:#14532d}

/* ─ Words ─ */
.wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:6px}
.wi{background:var(--card);border:1px solid var(--border);border-radius:5px;padding:.5rem .7rem}
.wi .en2{font-family:var(--mono);font-size:.76rem;font-weight:600}
.wi .zh2{font-size:.7rem;color:var(--muted);margin-top:2px}
.wi.mas{border-color:#86efac;background:#f0fdf4}
.wi.lrn{border-color:#fcd34d;background:#fffbeb}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:1rem}
.leg-i{display:flex;align-items:center;gap:4px;font-size:.66rem;color:var(--muted)}
.leg-d{width:10px;height:10px;border-radius:3px}

@media(max-width:580px){
  .sg{grid-template-columns:repeat(2,1fr)}
  .banner{flex-direction:column;align-items:flex-start}
  .rate-row{flex-wrap:wrap}
  .btn-r{flex:1 1 40%}
}
</style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="spinner"></div>
  <p>正在加载...</p>
</div>



<!-- Auth Screen -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">
      <h1>考研英语 · 单词计划</h1>
      <p>EBBINGHAUS SPACED REPETITION · 926 WORDS</p>
    </div>
    <div id="auth-msg"></div>
    <div id="auth-extra-fields"></div>
    <div class="form-row"><label>用户名</label><input id="f-username" type="text" placeholder="随意起个用户名" maxlength="20" autocomplete="username"></div>
    <div class="form-row"><label>密码</label><input id="f-pass" type="password" placeholder="至少6位" autocomplete="current-password"></div>
    <button class="btn-main" id="auth-btn" onclick="submitAuth()">登 录</button>
    <p class="auth-switch" id="auth-switch-text">还没有账号？ <span onclick="toggleAuth()">立即注册</span></p>
  </div>
</div>

<!-- App Screen -->
<div id="app-screen">
  <div class="app">
    <div class="topbar">
      <div class="topbar-left">
        <h1>考研英语 · 单词计划</h1>
        <p id="topbar-sub">EBBINGHAUS SPACED REPETITION · 926 WORDS</p>
      </div>
      <div class="topbar-right">
        <div class="user-chip">
          <div class="avatar" id="user-avatar"></div>
          <span id="user-name"></span>
        </div>
        <button class="btn-sm" onclick="logout()">退出</button>
      </div>
    </div>
    <div class="banner">
      <div>
        <h2 id="banner-title">第 — 天</h2>
        <p id="banner-date"></p>
      </div>
      <div class="pills" id="banner-pills"></div>
    </div>
    <div class="alert-bar" id="alert-bar"></div>
    <div class="tabs">
      <button class="tab on" onclick="switchTab('study')">📖 今日学习</button>
      <button class="tab" onclick="switchTab('calendar')">📅 打卡日历</button>
      <button class="tab" onclick="switchTab('rank')">🏆 排行榜</button>
      <button class="tab" onclick="switchTab('schedule')">📋 计划表</button>
      <button class="tab" onclick="switchTab('words')">📚 词库</button>
    </div>
    <div id="panel-study" class="panel on"></div>
    <div id="panel-calendar" class="panel"></div>
    <div id="panel-rank" class="panel"></div>
    <div id="panel-schedule" class="panel"></div>
    <div id="panel-words" class="panel"></div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════
   WORD DATA
══════════════════════════════════════════════ */
const WORDS=[
  {w:"abdicate",p:"[ˈæbdɪkeɪt]",m:"v. 退位、放弃"},
  {w:"abide",p:"[əˈbaɪd]",m:"v. 遵守、忍受"},
  {w:"abolish",p:"[əˈbɒlɪʃ]",m:"v. 废除、取消"},
  {w:"abound",p:"[əˈbaʊnd]",m:"v. 充满；到处都是"},
  {w:"absolute",p:"[ˈæbsəluːt]",m:"adj. 绝对的、专制的"},
  {w:"absorb",p:"[əbˈsɔːb]",m:"v. 吸收、承受"},
  {w:"abstract",p:"[æbˈstrækt]",m:"adj. 抽象的"},
  {w:"abundantly",p:"[əˈbʌndəntli]",m:"adv. 大量地、非常地"},
  {w:"abuse",p:"[əˈbjuːz]",m:"v/n. 虐待、滥用"},
  {w:"academic",p:"[ˌækəˈdemɪk]",m:"adj. 学术的"},
  {w:"accelerate",p:"[əkˈseləreɪt]",m:"v. 加速、促进"},
  {w:"access",p:"[ˈækses]",m:"v/n. 进入、使用"},
  {w:"acclaim",p:"[əˈkleɪm]",m:"v/n. 称赞、喝彩"},
  {w:"accommodate",p:"[əˈkɒmədeɪt]",m:"v. 容纳、（使）适应"},
  {w:"accompany",p:"[əˈkʌmpəni]",m:"v. 陪伴、伴随"},
  {w:"account",p:"[əˈkaʊnt]",m:"v. 占比、解释 n. 账户、资料"},
  {w:"accuracy",p:"[ˈækjərəsi]",m:"n. 精确（性）、准确（性）"},
  {w:"achieve",p:"[əˈtʃiːv]",m:"v. 获得、实现"},
  {w:"acknowledge",p:"[əkˈnɒlɪdʒ]",m:"v. 承认、认可"},
  {w:"acquire",p:"[əˈkwaɪə]",m:"v. 获得、习得"},
  {w:"activate",p:"[ˈæktɪveɪt]",m:"v. 刺激、激发"},
  {w:"acute",p:"[əˈkjuːt]",m:"adj. 严重的、急性的"},
  {w:"adaptable",p:"[əˈdæptəbl]",m:"adj. 适合的、能适应的"},
  {w:"adequate",p:"[ˈædɪkwɪt]",m:"adj. 充足的、充分的"},
  {w:"adhere",p:"[ədˈhɪə]",m:"v. 坚持、遵守"},
  {w:"adjoining",p:"[əˈdʒɔɪnɪŋ]",m:"adj. 邻接的、相邻的"},
  {w:"adjust",p:"[əˈdʒʌst]",m:"v. 调整、适应"},
  {w:"administration",p:"[ədˌmɪnɪsˈtreɪʃn]",m:"n. 管理、（美国）政府"},
  {w:"admire",p:"[ədˈmaɪə]",m:"v. 钦佩、欣赏"},
  {w:"admit",p:"[ədˈmɪt]",m:"v. 承认"},

   CONSTANTS
══════════════════════════════════════════════ */
const TOTAL=WORDS.length;
const NEW_PER_DAY=30;
const NEW_DAYS=Math.ceil(TOTAL/NEW_PER_DAY);
const INTERVALS=[1,3,7,15,30];
const CFG_KEY='kaoyan_fb_config';

/* ══════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════ */
function todayStr(){const d=new Date();return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`}
function p2(n){return String(n).padStart(2,'0')}
function addDays(s,n){const d=new Date(s);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000)}
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function hashColor(s){const cols=['#18181b','#1e40af','#166534','#92400e','#991b1b','#5b21b6','#0e7490','#065f46'];return cols[s.split('').reduce((a,c)=>a+c.charCodeAt(0),0)%cols.length]}
function initials(s){return (s||'?').slice(0,2).toUpperCase()}
function show(id){document.getElementById(id).style.display='flex'}
function hide(id){document.getElementById(id).style.display='none'}

async function loadUserDoc(uid){
  const snap=await db.collection('users').doc(uid).get();
  if(snap.exists)return snap.data();
  const doc={startDate:todayStr(),nickname:'',createdAt:Date.now()};
  await db.collection('users').doc(uid).set(doc);
  return doc;
}
async function loadUserState(uid){
  const snap=await db.collection('states').doc(uid).get();
  if(snap.exists)return snap.data();
  return{wordStates:{},checkins:{},sessionProgress:{}};
}
async function saveState(){
  await db.collection('states').doc(currentUser.uid).set(userState);
}

/* ══════════════════════════════════════════════
   GAME LOGIC
══════════════════════════════════════════════ */
function currentDay(){return daysBetween(userDoc.startDate,todayStr())+1}
function getNewWords(day){if(day<1||day>NEW_DAYS)return[];const s=(day-1)*NEW_PER_DAY;return WORDS.slice(s,s+NEW_PER_DAY).map((w,i)=>({...w,idx:s+i}))}
function getReviewWords(dateStr){
  const rv=[];
  for(let wi=0;wi<WORDS.length;wi++){
    const ws=userState.wordStates[wi];
    if(!ws||!ws.learned)continue;
    for(let ri=0;ri<INTERVALS.length;ri++){
      if(addDays(ws.learned,INTERVALS[ri])===dateStr){
        rv.push({...WORDS[wi],idx:wi,reviewInterval:ri,doneKey:`${dateStr}_r${wi}_${ri}`});break;
      }
    }
  }
  return rv;
}
function getTodayTasks(){
  const day=currentDay();
  const today=todayStr();
  const nw=getNewWords(day);
  const rv=getReviewWords(today);
  const sp=userState.sessionProgress[today]||{newDone:[],reviewDone:[]};
  return{
    newWords:nw,reviewWords:rv,
    pendingNew:nw.filter(w=>!sp.newDone.includes(w.idx)),
    pendingReview:rv.filter(w=>!sp.reviewDone.includes(w.doneKey)),
    sp,day
  };
}
function calcStreak(){
  let s=0,d=new Date(todayStr());
  while(true){
    const k=`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
    if(userState.checkins[k]&&userState.checkins[k].checked){s++;d.setDate(d.getDate()-1)}else break;
  }
  return s;
}

// 用户名转内部邮箱格式
function toEmail(username){const h=Array.from(username).reduce((a,c)=>a+c.charCodeAt(0),0);const safe=username.toLowerCase().replace(/[^a-z0-9]/g,'');const id=safe.length>=3?safe.slice(0,20):'u'+h;return id+'@kaoyan.app'}

function renderAuth(){
  hide('loading');
  document.getElementById('auth-screen').style.display='flex';
  const isLogin=authMode==='login';
  document.getElementById('auth-extra-fields').innerHTML=isLogin?'':
    `<div class="form-row"><label>昵称（可选）</label><input id="f-nick" type="text" placeholder="排行榜上显示的名字" maxlength="12"></div>`;
  document.getElementById('auth-btn').textContent=isLogin?'登 录':'注 册';
  document.getElementById('auth-switch-text').innerHTML=isLogin
    ?'还没有账号？ <span onclick="toggleAuth()">立即注册</span>'
    :'已有账号？ <span onclick="toggleAuth()">返回登录</span>';
  document.getElementById('f-username').focus();
}
function toggleAuth(){authMode=authMode==='login'?'register':'login';document.getElementById('auth-msg').innerHTML='';renderAuth()}

async function submitAuth(){
  const btn=document.getElementById('auth-btn');
  const username=document.getElementById('f-username').value.trim();
  const pass=document.getElementById('f-pass').value;
  const nick=authMode==='register'?(document.getElementById('f-nick')||{value:''}).value.trim():'';
  if(!username||!pass){showAuthMsg('请填写用户名和密码','err');return}
  if(username.length<2){showAuthMsg('用户名至少2个字符','err');return}
  // 允许任意字符，toEmail会处理转换
  if(pass.length<6){showAuthMsg('密码至少6位','err');return}
  const email=toEmail(username);
  const displayName=nick||username;
  btn.disabled=true;btn.textContent='请稍候...';
  try{
    let cred;
    if(authMode==='login'){
      cred=await auth.signInWithEmailAndPassword(email,pass);
    }else{
      cred=await auth.createUserWithEmailAndPassword(email,pass);
      await cred.user.updateProfile({displayName});
    }
    await onLogin(cred.user);
  }catch(e){
    btn.disabled=false;btn.textContent=authMode==='login'?'登 录':'注 册';
    const msgs={
      'auth/user-not-found':'用户名不存在',
      'auth/wrong-password':'密码错误',
      'auth/email-already-in-use':'该用户名已被注册',
      'auth/weak-password':'密码太简单（至少6位）',
      'auth/invalid-credential':'用户名或密码错误',
    };
    showAuthMsg(msgs[e.code]||'登录失败，请重试','err');
  }
}

function showAuthMsg(msg,type){
  document.getElementById('auth-msg').innerHTML=`<div class="msg-${type}">${msg}</div>`;
}

async function onLogin(user){
  currentUser=user;
  userDoc=await loadUserDoc(user.uid);
  // save nickname from Google/displayName
  if(user.displayName&&!userDoc.nickname){
    userDoc.nickname=user.displayName;
    await db.collection('users').doc(user.uid).update({nickname:user.displayName});
  }
  userState=await loadUserState(user.uid);
  document.getElementById('auth-screen').style.display='none';
  renderApp();
}

async function logout(){
  await auth.signOut();
  currentUser=null;userDoc=null;userState=null;
  studyQueue=[];currentCard=null;isFlipped=false;activeTab='study';
  document.getElementById('app-screen').style.display='none';
  document.getElementById('auth-screen').style.display='flex';
}

function updateBannerPills(){
  const{pendingNew,pendingReview,newWords,reviewWords,sp}=getTodayTasks();
  const allDone=pendingNew.length===0&&pendingReview.length===0;
  const pp=document.getElementById('banner-pills');
  if(pp) pp.innerHTML=`
    ${newWords.length>0?`<span class="pill p-new">新词 ${sp.newDone.length}/${newWords.length}</span>`:''}
    ${reviewWords.length>0?`<span class="pill p-rev">复习 ${sp.reviewDone.length}/${reviewWords.length}</span>`:''}
    ${allDone?`<span class="pill p-done">✓ 今日完成</span>`:''}
  `;

  if(ab){
    const pending=pendingNew.length+pendingReview.length;

      ${pendingNew.length>0?`<span>📌 <b>${pendingNew.length}</b> 个新词未学习</span>`:''}
      ${pendingReview.length>0?`<span>🔁 <b>${pendingReview.length}</b> 个词待复习</span>`:''}

}

  if(tab==='calendar') renderCalendarPanel();
  if(tab==='rank') renderRankPanel();

}

function flipCard(){isFlipped=!isFlipped;renderStudyPanel()}

function rateCard(level){
  if(!currentCard)return;
  const today=todayStr();
  if(!userState.sessionProgress[today])userState.sessionProgress[today]={newDone:[],reviewDone:[]};
  if(currentCard.type==='new'){
    if(!userState.wordStates[currentCard.idx])userState.wordStates[currentCard.idx]={};
    userState.wordStates[currentCard.idx].learned=today;
    userState.wordStates[currentCard.idx].ease=level;
    userState.sessionProgress[today].newDone.push(currentCard.idx);
  }else{
    userState.sessionProgress[today].reviewDone.push(currentCard.doneKey);
    if(userState.wordStates[currentCard.idx])userState.wordStates[currentCard.idx].ease=level;
  }
  saveState();
  studyQueue.shift();
  isFlipped=false;
  currentCard=studyQueue[0]||null;
  updateBannerPills();
  renderStudyPanel();
}

async function doCheckin(){
  const today=todayStr();
  if(!userState.checkins[today])userState.checkins[today]={};
  userState.checkins[today].checked=true;
  userState.checkins[today].ts=Date.now();
  await saveState();
  renderStudyPanel();
}

    <div class="legend">
      <div class="leg-i"><div class="leg-d" style="background:#15803d"></div>全部完成</div>
      <div class="leg-i"><div class="leg-d" style="background:#ca8a04"></div>部分完成</div>
      <div class="leg-i"><div class="leg-d" style="background:#18181b"></div>仅打卡</div>
    </div>
    <div class="cal-hdr">
      <div class="cal-nav"><button onclick="calPrev()">←</button></div>
      <h3>${calYear}年${calMonth+1}月</h3>
      <div class="cal-nav"><button onclick="calNext()">→</button></div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="sg">
      <div class="sc hi"><div class="lbl">当前第</div><div class="val">${day} 天</div></div>
      <div class="sc"><div class="lbl">🔥 连续打卡</div><div class="val">${streak} 天</div></div>
      <div class="sc"><div class="lbl">累计打卡</div><div class="val">${totalCheckins}</div></div>
      <div class="sc"><div class="lbl">已掌握词汇</div><div class="val">${mastered}</div></div>
    </div>
    <div class="prog-wrap">
      <div class="prog-label"><span>学习进度</span><span>第${day}天</span></div>
      <div class="prog-track"><div class="prog-fill" style="width:${Math.min(Math.round(day/(NEW_DAYS+30)*100),100)}%"></div></div>
    </div>
    <div class="prog-wrap">
      <div class="prog-label"><span>词汇掌握率</span><span>${mastered}/${TOTAL} (${Math.round(mastered/TOTAL*100)}%)</span></div>
      <div class="prog-track"><div class="prog-fill g" style="width:${Math.round(mastered/TOTAL*100)}%"></div></div>
    </div>
  `;
  buildCalGrid();
}
function buildCalGrid(){
  const grid=document.getElementById('cal-grid');if(!grid)return;
  const today=todayStr();
  grid.innerHTML='';
  ['日','一','二','三','四','五','六'].forEach(d=>{const e=document.createElement('div');e.className='cal-lbl';e.textContent=d;grid.appendChild(e)});
  const first=new Date(calYear,calMonth,1).getDay();
  for(let i=0;i<first;i++){const e=document.createElement('div');e.className='cal-d';grid.appendChild(e)}
  const dim=new Date(calYear,calMonth+1,0).getDate();
  for(let d=1;d<=dim;d++){
    const ds=`${calYear}-${p2(calMonth+1)}-${p2(d)}`;
    const dayNum=daysBetween(userDoc.startDate,ds)+1;
    const inRange=dayNum>=1&&dayNum<=100;
    const isFuture=ds>today;
    const isToday=ds===today;
    const ci=userState.checkins[ds];
    const sp=userState.sessionProgress[ds]||{newDone:[],reviewDone:[]};
    const el=document.createElement('div');
    el.className='cal-d';
    if(isToday)el.classList.add('today');
    if(inRange&&!isFuture){
      const nw=getNewWords(dayNum);
      const rv=getReviewWords(ds);
      const total=nw.length+rv.length;
      const done=sp.newDone.length+sp.reviewDone.length;
      if(ci?.checked) el.classList.add(done>=total&&total>0?'full':done>0?'partial':'chk');
      else if(total===0) el.classList.add('no-task');
    } else if(isFuture) el.classList.add('future');
    else if(!inRange) el.classList.add('other-month');
    el.innerHTML=`<span class="cal-dnum">${d}</span>${inRange&&!isFuture?'<span class="cal-dot"></span>':''}`;
    grid.appendChild(el);
  }
}
function calPrev(){calMonth--;if(calMonth<0){calMonth=11;calYear--}renderCalendarPanel()}
function calNext(){calMonth++;if(calMonth>11){calMonth=0;calYear++}renderCalendarPanel()}

/* ── Rank Panel ── */
async function renderRankPanel(){
  const el=document.getElementById('panel-rank');if(!el)return;
  el.innerHTML='<div style="text-align:center;padding:2.5rem;color:var(--muted);font-size:.8rem">加载排行榜中...</div>';
  try{
    const usersSnap=await db.collection('users').get();
    const rows=[];
    for(const doc of usersSnap.docs){
      const u=doc.data();
      const uid=doc.id;
      const st=await (await db.collection('states').doc(uid).get()).data()||{wordStates:{},checkins:{},sessionProgress:{}};
      const startDate=u.startDate||todayStr();
      const day=daysBetween(startDate,todayStr())+1;
      const mastered=Object.values(st.wordStates||{}).filter(ws=>ws.learned&&ws.ease>=2).length;
      const checkins=Object.values(st.checkins||{}).filter(c=>c.checked).length;
      let streak=0,d2=new Date(todayStr());
      while(true){const s=`${d2.getFullYear()}-${p2(d2.getMonth()+1)}-${p2(d2.getDate())}`;if(st.checkins?.[s]?.checked){streak++;d2.setDate(d2.getDate()-1)}else break}
      const today=todayStr();
      const sp=st.sessionProgress?.[today]||{newDone:[],reviewDone:[]};
      const nw=getNewWords(day);const rv=[];// simplified for rank
      const todayDone=sp.newDone.length+sp.reviewDone.length;
      const score=mastered*3+checkins*2+streak;
      const nick=u.nickname||u.email?.split('@')[0]||'用户';
      rows.push({uid,nick,mastered,checkins,streak,day,todayDone,score});
    }
    rows.sort((a,b)=>b.score-a.score);
    const html=rows.map((u,i)=>{
      const rank=i+1;
      const medal=rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':rank;
      const isMe=u.uid===currentUser.uid;
      return `<div class="lb-row${isMe?' me':''}">
        <div class="lb-rank">${medal}</div>
        <div class="avatar" style="background:${hashColor(u.uid)};width:32px;height:32px;border-radius:50%;flex-shrink:0;font-size:.7rem">${initials(u.nick)}</div>
        <div class="lb-info">
          <div class="lb-name">${u.nick}${isMe?' <span style="font-size:.62rem;color:var(--muted)">(我)</span>':''}</div>
          <div class="lb-sub">第${u.day}天 · 今日已学${u.todayDone}词</div>
        </div>
        <div class="lb-stats">
          <div>📚 ${u.mastered}词</div>
          <div style="font-size:.65rem;color:var(--muted)">🔥 ${u.streak}天</div>
        </div>
      </div>`;
    }).join('');
    el.innerHTML=`<p style="font-size:.7rem;color:var(--muted);margin-bottom:1rem">共 ${rows.length} 名学员 · 按掌握词数综合排名</p>${html||'<p style="color:var(--muted);text-align:center;padding:2rem">暂无数据</p>'}`;
  }catch(e){el.innerHTML=`<p style="color:var(--red);padding:1rem">加载失败：${e.message}</p>`}
}

/* ── Schedule Panel ── */
function renderSchedulePanel(){
  const el=document.getElementById('panel-schedule');if(!el)return;
  const today=todayStr();const day=currentDay();
  let rows='';
  for(let d=1;d<=NEW_DAYS+30;d++){
    const ds=addDays(userDoc.startDate,d-1);
    const nw=getNewWords(d);const rv=getReviewWords(ds);
    const sp=userState.sessionProgress[ds]||{newDone:[],reviewDone:[]};
    const ci=userState.checkins[ds];
    const total=nw.length+rv.length;const done=sp.newDone.length+sp.reviewDone.length;
    const isToday=d===day;const isPast=ds<today;
    let status='';
    if(ci?.checked) status=`<span class="badge bd">✓ 打卡</span>`;
    else if(isToday) status=`<span class="badge bn">今天</span>`;
    else if(isPast&&total>0) status=done>=total?`<span class="badge bd">完成</span>`:`<span class="badge br">${done}/${total}</span>`;
    else if(ds>today) status=`<span style="font-size:.6rem;color:var(--muted)">待学</span>`;
    rows+=`<tr class="${isToday?'trow':''}"><td style="font-family:var(--mono);font-size:.68rem">Day ${d}</td><td style="font-size:.68rem">${ds}</td><td>${nw.length?`<span class="badge bn">+${nw.length}</span>`:'—'}</td><td>${rv.length?`<span class="badge br">${rv.length}</span>`:'—'}</td><td style="font-weight:500">${total||'—'}</td><td>${status}</td></tr>`;
  }
  el.innerHTML=`<p style="font-size:.7rem;color:var(--muted);margin-bottom:.85rem">前31天每天30个新词，学完全部926词，之后进入纯复习阶段</p><div style="overflow-x:auto"><table class="sch-t"><thead><tr><th>天数</th><th>日期</th><th>新词</th><th>复习</th><th>合计</th><th>状态</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  setTimeout(()=>{const t=el.querySelector('.trow');if(t)t.scrollIntoView({behavior:'smooth',block:'center'})},100);
}

/* ── Words Panel ── */
function renderWordsPanel(){
  const el=document.getElementById('panel-words');if(!el)return;
  const filters=[['all','全部'],['mastered','已掌握'],['learning','学习中'],['new','未学习']];
  const btns=filters.map(([f,l])=>`<button class="btn-sm" style="${wordFilter===f?'background:var(--ink);color:#fff;border-color:var(--ink)':''}" onclick="setWF('${f}')">${l}</button>`).join('');
  const items=WORDS.map((w,i)=>{
    const ws=userState.wordStates[i];const isL=ws&&ws.learned;const isM=isL&&ws.ease>=2;
    if(wordFilter==='mastered'&&!isM)return'';
    if(wordFilter==='learning'&&(!isL||isM))return'';
    if(wordFilter==='new'&&isL)return'';
    return`<div class="wi ${isM?'mas':isL?'lrn':''}"><div class="en2">${w.w}</div><div class="zh2">${w.m}</div></div>`;
  }).join('');
  el.innerHTML=`<div style="display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap">${btns}</div><div class="wl">${items||'<p style="color:var(--muted);font-size:.78rem">暂无词汇</p>'}</div>`;
}
function setWF(f){wordFilter=f;renderWordsPanel()}
